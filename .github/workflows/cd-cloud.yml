name: Cloud Deployment CD (Azure AKS / Kubernetes)

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'backend/**'
      - 'frontend/**'
      - 'admin/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Containers & Deploy to Cloud Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/medstore-backend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/medstore-backend:latest

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/medstore-frontend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/medstore-frontend:latest

      - name: Build & Push Admin Container
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/medstore-admin:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/medstore-admin:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: 'medstore-cloud-rg'
          cluster-name: 'medstore-aks-cluster'

      - name: Deploy Kubernetes Manifests to AKS
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/backend -n default --timeout=120s
          kubectl rollout status deployment/frontend -n default --timeout=120s
          kubectl rollout status deployment/admin -n default --timeout=120s
